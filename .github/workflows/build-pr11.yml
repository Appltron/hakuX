name: Build hakuX PR #11 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/rfandango/hakuX.git || true
          git fetch upstream pull/11/head:pr-11

      - name: Checkout PR branch
        run: |
          git checkout pr-11

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to installing the legacy "tools" package,
          # which is no longer available from Google's SDK repository.
          # Install all required SDK packages explicitly in the next step.
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "::error::Android SDK path was not set by setup-android."
            exit 1
          fi

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          # setup-android has already accepted the SDK licenses above.
          # Avoid piping yes into sdkmanager: pipefail may turn its expected
          # SIGPIPE into a failed step after sdkmanager accepts the licenses.
          sdkmanager --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Initialize submodules
        run: |
          git submodule update --init --recursive external/fex
          git -C external/fex submodule update --init --recursive \
            External/fmt External/range-v3 External/rpmalloc \
            External/unordered_dense External/xxhash Source/Common/cpp-optparse

      - name: Prepare native dependencies
        shell: bash
        run: |
          set -euo pipefail

          DEPS="$GITHUB_WORKSPACE/native-deps"
          mkdir -p "$DEPS/root/subprojects"

          clone_tag() {
            local url="$1"
            local ref="$2"
            local destination="$3"
            git clone --depth 1 --branch "$ref" --recurse-submodules "$url" "$destination"
          }

          # Versions are pinned to the revisions documented by android/README.md
          # in the PR branch being built.
          clone_tag https://github.com/zeux/volk.git \
            1.4.304 "$DEPS/volk"
          clone_tag https://github.com/KhronosGroup/glslang.git \
            16.1.0 "$DEPS/glslang"
          clone_tag https://github.com/KhronosGroup/SPIRV-Reflect.git \
            vulkan-sdk-1.4.328.0 "$DEPS/spirv_reflect"
          clone_tag https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator.git \
            v3.3.0 "$DEPS/vma"
          clone_tag https://github.com/libsdl-org/SDL.git \
            release-3.4.18 "$DEPS/SDL3"

          # This dependency is pinned to a commit rather than a release tag.
          git clone --filter=blob:none --recurse-submodules \
            https://github.com/bylaws/libadrenotools.git "$DEPS/adrenotools"
          git -C "$DEPS/adrenotools" checkout --detach 8fae8ce
          git -C "$DEPS/adrenotools" submodule update --init --recursive
          git -C "$DEPS/adrenotools" apply \
            "$GITHUB_WORKSPACE/tools/native/adrenotools-kgsl-context-priority.patch"

          # This pinned commit is valid but may not be reachable from the
          # repository's default branch history. Download the commit archive
          # directly rather than cloning the branch and checking out its SHA.
          NV2A_DIR="$DEPS/root/subprojects/nv2a_vsh_cpu"
          mkdir -p "$NV2A_DIR"
          curl --fail --location --retry 3 --retry-delay 2 --silent --show-error \
            "https://codeload.github.com/xemu-project/nv2a_vsh_cpu/tar.gz/561fe80da57a881f89000256b459440c0178a7ce" \
            | tar -xz --strip-components=1 -C "$NV2A_DIR"

      - name: Build native core
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_NDK="$ANDROID_HOME/ndk/29.0.14206865"
          export NDK_PATH="$ANDROID_NDK"
          export NDK_CMAKE="$NDK_PATH/build/cmake/android.toolchain.cmake"

          cmake -S native -B build/native/core -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_CMAKE" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNC_DEPS="$GITHUB_WORKSPACE/native-deps"

          ninja -C build/native/core hakuxcore
          bash tools/native/app-libs.sh

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          # The PR branch hard-codes a Linux JDK path that is not present on
          # this runner. setup-java has already selected the correct JDK in JAVA_HOME.
          sed -i '/^[[:space:]]*org\.gradle\.java\.home[[:space:]]*=/d' android/gradle.properties

          if [[ -z "${JAVA_HOME:-}" || ! -x "$JAVA_HOME/bin/java" ]]; then
            echo "::error::JAVA_HOME does not point to a usable JDK."
            exit 1
          fi

          echo "Building APK with JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version

          cd android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hakuX-pr11-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
