name: Build hakuX PR #11 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/rfandango/hakuX.git || true
          git fetch upstream pull/11/head:pr-11

      - name: Checkout PR branch
        run: |
          git checkout pr-11

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to installing the legacy "tools" package,
          # which is no longer available from Google's SDK repository.
          # Install all required SDK packages explicitly in the next step.
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "::error::Android SDK path was not set by setup-android."
            exit 1
          fi

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses
          sdkmanager --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Initialize submodules
        run: |
          git submodule update --init --recursive external/fex
          git -C external/fex submodule update --init --recursive \
            External/fmt External/range-v3 External/rpmalloc \
            External/unordered_dense External/xxhash Source/Common/cpp-optparse

      - name: Build native core
        run: |
          export NDK_PATH="$ANDROID_HOME/ndk/29.0.14206865"
          export NDK_CMAKE="$NDK_PATH/build/cmake/android.toolchain.cmake"

          cmake -S native -B build/native/core -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_CMAKE" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNC_DEPS="$GITHUB_WORKSPACE/native-deps"

          ninja -C build/native/core hakuxcore
          bash tools/native/app-libs.sh

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hakuX-pr11-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
